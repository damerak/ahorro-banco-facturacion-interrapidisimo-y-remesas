<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irusaga - Logística Interrapidísimo</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    
    <style>
        :root {
            --primary: #1a73e8;
            --secondary: #34a853;
            --danger: #d93025;
            --warning: #f9ab00;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--light);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .container { padding: 20px; max-width: 1300px; margin: 0 auto; width: 100%; box-sizing: border-box; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; color: white; cursor: pointer; text-transform: uppercase; margin-bottom: 5px;
        }
        .btn-clear { background: var(--danger); }
        /* Estilo para botón festivos */
        .btn-holiday { background: var(--warning); color: #000 !important; margin-left: 5px; }

        /* --- ESTILOS TABLA --- */
        #view-inter * { font-family: Arial, Helvetica, sans-serif !important; font-weight: bold !important; font-size: 13px !important; box-sizing: border-box; }
        
        #view-inter .header-controls-inter {
            background: white; padding: 15px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 25px;
            align-items: center; margin-bottom: 20px; width: 100%;
            justify-content: center;
        }

        #view-inter .table-container-inter {
            display: flex; gap: 15px; justify-content: center; align-items: flex-start;
            flex-wrap: nowrap;
        }

        #view-inter table { 
            border-collapse: collapse; 
            background: white; 
            border: 1px solid #000;
            flex: 1;
        }

        #view-inter th, #view-inter td { border: 1px solid #000; padding: 0; text-align: center; height: 35px; vertical-align: middle; }
        #view-inter thead th { background-color: #e9ecef; text-transform: uppercase; padding: 5px; font-size: 11px !important; }
        
        #view-inter .date-col { background-color: #FFC107; width: 70px; }
        
        #view-inter .currency-col { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: white;
            height: 35px;
            padding: 0 5px;
        }
        #view-inter .currency-prefix { margin-right: 2px; }
        #view-inter .currency-input { 
            flex: 1;
            border: none; 
            text-align: right; 
            outline: none; 
            background: transparent; 
            height: 100%;
            width: 100%;
            padding: 0;
        }
        
        .col-cant { width: 45px; }
        .col-total { width: 50px; background-color: #f0f0f0; }

        #view-inter .small-input { 
            width: 100%; height: 100%; border: none; text-align: center; 
            outline: none; background: transparent; 
        }

        /* --- QUITAR FLECHAS (SCROLL) DE INPUTS NUMERICOS --- */
        #view-inter input[type=number]::-webkit-inner-spin-button, 
        #view-inter input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        #view-inter input[type=number] {
            -moz-appearance: textfield;
        }

        #view-inter .footer-summary-inter {
            margin-top: 25px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%;
        }
        #view-inter .summary-box-inter {
            background: white; padding: 10px; border-radius: 10px; border: 3px solid #FFC107;
            display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 160px;
        }
        #view-inter .val-display-inter { font-size: 18px !important; color: #2e7d32; }

        select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; }

        /* MODAL CALENDARIO FESTIVOS */
        #holidayModal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px; width: 320px; text-align: center;
        }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px;
        }
        .cal-day {
            padding: 8px; border: 1px solid #ddd; cursor: pointer; border-radius: 4px; font-size: 12px;
        }
        .cal-day.selected { background: var(--danger); color: white; border-color: var(--danger); }
        .cal-day:hover { background: #eee; }
        .cal-day.disabled { color: #ccc; cursor: default; }

        @media print {
            .header-controls-inter, .btn-clear, .btn-holiday { display: none !important; }
            body { background: white; }
            .container { padding: 0; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        <div id="view-inter">
            <div class="header-controls-inter">
                <div>AÑO: <select id="yearSelectInter"></select></div>
                <div>MES: 
                    <select id="monthSelectInter">
                        <option value="0">ENERO</option><option value="1">FEBRERO</option>
                        <option value="2">MARZO</option><option value="3">ABRIL</option>
                        <option value="4">MAYO</option><option value="5">JUNIO</option>
                        <option value="6">JULIO</option><option value="7">AGOSTO</option>
                        <option value="8">SEPTIEMBRE</option><option value="9">OCTUBRE</option>
                        <option value="10">NOVIEMBRE</option><option value="11">DICIEMBRE</option>
                    </select>
                </div>
                <button class="btn btn-clear" style="width: auto;" onclick="clearAllFieldsInter()">LIMPIAR MES</button>
                <button class="btn btn-holiday" style="width: auto;" onclick="openHolidayModal()">FESTIVOS</button>
            </div>

            <div class="table-container-inter" id="mainContainerInter"></div>

            <div class="footer-summary-inter">
                <div class="summary-box-inter"><span>TOTAL VALOR</span><span id="totalGeneralInter" class="val-display-inter">$ 0</span></div>
                <div class="summary-box-inter" style="border-color: #2196F3;"><span>TOTAL ENVÍOS</span><span id="totalEnviosInter" class="val-display-inter" style="color: #1976D2;">0</span></div>
                <div class="summary-box-inter" style="border-color: #f44336;"><span>20%</span><span id="totalGananciaInter" class="val-display-inter" style="color: #c62828;">$ 0</span></div>
                <div class="summary-box-inter" style="border-color: #9c27b0;"><span>ICA (4.14 x 1000)</span><span id="totalIcaInter" class="val-display-inter" style="color: #7b1fa2;">$ 0</span></div>
                <div class="summary-box-inter" style="border-color: #ff9800;"><span>RETE FUENTE</span><span id="totalReteInter" class="val-display-inter" style="color: #e65100;">$ 0</span></div>
                <div class="summary-box-inter" style="border-color: #009688;"><span>TOTAL GANADO</span><span id="totalNetoInter" class="val-display-inter" style="color: #00796b;">$ 0</span></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Festivos -->
<div id="holidayModal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top:0">Festivos</h3>
        <p style="font-size: 11px; color: #666;">Selecciona los días festivos para ocultarlos de la tabla.</p>
        <div class="calendar-grid" id="calendarGrid"></div>
        <button class="btn" style="background: var(--primary); margin-top: 20px;" onclick="closeHolidayModal()">CERRAR Y GUARDAR</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAbGwL0wsMBsHfaNUoPlceWWtp0tKgt2m8",
        authDomain: "ahorrobancofacturacion.firebaseapp.com",
        databaseURL: "https://ahorrobancofacturacion-default-rtdb.firebaseio.com",
        projectId: "ahorrobancofacturacion",
        storageBucket: "ahorrobancofacturacion.firebasestorage.app",
        messagingSenderId: "1056148162736",
        appId: "1:1056148162736:web:939aa574f76d22fea11375"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const monthSelectInter = document.getElementById('monthSelectInter');
    const yearSelectInter = document.getElementById('yearSelectInter');
    const containerInter = document.getElementById('mainContainerInter');
    
    const totalGeneralDispInter = document.getElementById('totalGeneralInter');
    const totalEnviosDispInter = document.getElementById('totalEnviosInter');
    const totalGananciaDispInter = document.getElementById('totalGananciaInter');
    const totalIcaDispInter = document.getElementById('totalIcaInter');
    const totalReteDispInter = document.getElementById('totalReteInter');
    const totalNetoDispInter = document.getElementById('totalNetoInter');

    function initInter() {
        const currentYear = new Date().getFullYear();
        for(let i = currentYear - 2; i <= currentYear + 2; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = i;
            if(i === currentYear) opt.selected = true;
            yearSelectInter.appendChild(opt);
        }
        monthSelectInter.value = new Date().getMonth();
        monthSelectInter.onchange = generateTablesInter;
        yearSelectInter.onchange = generateTablesInter;
        generateTablesInter();
    }

    function formatWithDotsInter(n) { 
        if(!n || n == "0") return "";
        return n.toString().replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, "."); 
    }

    function cleanDotsInter(s) { 
        let val = s.toString().replace(/\./g, "");
        return val === "" ? "" : val;
    }

    function getStorageKeyInter() { return `inter_local_${yearSelectInter.value}_${monthSelectInter.value}`; }
    function getHolidayKeyInter() { return `inter_holidays_${yearSelectInter.value}_${monthSelectInter.value}`; }

    function saveInterData() {
        const rows = document.querySelectorAll('.data-row-inter');
        const dataToSave = {};
        rows.forEach(row => {
            const dateKey = row.getAttribute('data-date');
            const mVal = cleanDotsInter(row.querySelector('.currency-input').value);
            const aVal = row.querySelector('.val-a').value;
            const bVal = row.querySelector('.val-b').value;
            if(mVal || aVal || bVal) {
                dataToSave[dateKey] = { m: mVal, a: aVal, b: bVal };
            }
        });
        const key = getStorageKeyInter();
        localStorage.setItem(key, JSON.stringify(dataToSave));
        db.ref('logistica/' + key).set(dataToSave);
        calculateSummariesInter();
    }

    function calculateSummariesInter() {
        let totalDineroRecaudado = 0;
        let totalCantidades = 0;

        document.querySelectorAll('.data-row-inter').forEach(row => {
            const valStr = cleanDotsInter(row.querySelector('.currency-input').value);
            totalDineroRecaudado += parseInt(valStr) || 0;
            
            const a = parseInt(row.querySelector('.val-a').value) || 0;
            const b = parseInt(row.querySelector('.val-b').value) || 0;
            const sumaFila = a + b;
            totalCantidades += sumaFila;
            row.querySelector('.row-total-inter').innerHTML = sumaFila > 0 ? sumaFila : "";
        });

        const ganancia = Math.floor(totalDineroRecaudado * 0.20);
        const impuestoIca = Math.floor(ganancia * 0.00414);
        const reteFuente = Math.floor(ganancia * 0.01);
        const totalNeto = ganancia - impuestoIca - reteFuente;
        
        totalGeneralDispInter.innerHTML = "$ " + (totalDineroRecaudado > 0 ? formatWithDotsInter(totalDineroRecaudado) : "0");
        totalEnviosDispInter.innerHTML = totalCantidades;
        totalGananciaDispInter.innerHTML = "$ " + (totalDineroRecaudado > 0 ? formatWithDotsInter(ganancia) : "0");
        totalIcaDispInter.innerHTML = "$ " + (totalDineroRecaudado > 0 ? formatWithDotsInter(impuestoIca) : "0");
        totalReteDispInter.innerHTML = "$ " + (totalDineroRecaudado > 0 ? formatWithDotsInter(reteFuente) : "0");
        totalNetoDispInter.innerHTML = "$ " + (totalDineroRecaudado > 0 ? formatWithDotsInter(totalNeto) : "0");
    }

    function generateTablesInter() {
        const year = parseInt(yearSelectInter.value);
        const month = parseInt(monthSelectInter.value);
        const key = getStorageKeyInter();
        const hKey = getHolidayKeyInter();
        
        // Cargar festivos primero
        db.ref('logistica_festivos/' + hKey).once('value', (hSnap) => {
            const cloudHolidays = hSnap.val() || [];
            localStorage.setItem(hKey, JSON.stringify(cloudHolidays));
            
            // Cargar datos
            db.ref('logistica/' + key).once('value', (snapshot) => {
                const cloudData = snapshot.val();
                if(cloudData) localStorage.setItem(key, JSON.stringify(cloudData));
                
                let savedData = JSON.parse(localStorage.getItem(key)) || {};
                let holidays = JSON.parse(localStorage.getItem(hKey)) || [];
                
                containerInter.innerHTML = '';
                let daysCol1 = [];
                let daysCol2 = [];
                
                let date = new Date(year, month, 1);
                while (date.getMonth() === month) {
                    const dayNum = date.getDate();
                    // No incluir si es Domingo O si está en la lista de festivos
                    if (date.getDay() !== 0 && !holidays.includes(dayNum)) {
                        let mName = date.toLocaleString('es-ES', { month: 'short' }).toUpperCase();
                        let dayObj = { label: `${mName}-${dayNum}`, dayNum: dayNum };
                        if (dayNum <= 15) { daysCol1.push(dayObj); } 
                        else { daysCol2.push(dayObj); }
                    }
                    date.setDate(date.getDate() + 1);
                }
                
                containerInter.appendChild(createTableInter(daysCol1, savedData));
                containerInter.appendChild(createTableInter(daysCol2, savedData));
                calculateSummariesInter();
            });
        });
    }

    function createTableInter(dayList, savedData) {
        const table = document.createElement('table');
        table.innerHTML = `<thead><tr><th>MES</th><th>VALOR</th><th class="col-cant">C1</th><th class="col-cant">C2</th><th class="col-total">TOT</th></tr></thead>`;
        const tbody = document.createElement('tbody');
        dayList.forEach(dayObj => {
            const tr = document.createElement('tr');
            tr.className = 'data-row-inter';
            tr.setAttribute('data-date', dayObj.label);
            const rowData = savedData[dayObj.label] || { m: "", a: "", b: "" };
            
            tr.innerHTML = `
                <td class="date-col">${dayObj.label}</td>
                <td style="padding:0">
                    <div class="currency-col" onclick="this.querySelector('.currency-input').focus()">
                        <span class="currency-prefix">$</span>
                        <input class="currency-input" type="text" value="${formatWithDotsInter(rowData.m)}">
                    </div>
                </td>
                <td class="col-cant"><input type="number" class="small-input val-a" value="${rowData.a || ""}"></td>
                <td class="col-cant"><input type="number" class="small-input val-b" value="${rowData.b || ""}"></td>
                <td class="row-total-inter col-total"></td>`;
            
            const curInput = tr.querySelector('.currency-input');
            curInput.oninput = (e) => { 
                e.target.value = formatWithDotsInter(e.target.value); 
                saveInterData(); 
            };
            
            const inputsCant = tr.querySelectorAll('.small-input');
            inputsCant.forEach(inp => {
                inp.oninput = function() {
                    if(this.value.length > 3) this.value = this.value.slice(0,3);
                    saveInterData();
                };
            });

            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        return table;
    }

    // --- FUNCIONES MODAL FESTIVOS ---
    function openHolidayModal() {
        const modal = document.getElementById('holidayModal');
        const grid = document.getElementById('calendarGrid');
        const year = parseInt(yearSelectInter.value);
        const month = parseInt(monthSelectInter.value);
        const hKey = getHolidayKeyInter();
        const savedHolidays = JSON.parse(localStorage.getItem(hKey)) || [];

        document.getElementById('modalTitle').innerText = `Festivos ${monthSelectInter.options[month].text}`;
        grid.innerHTML = '';
        
        // Crear cabecera días
        ['D','L','M','X','J','V','S'].forEach(d => {
            let div = document.createElement('div');
            div.innerText = d; div.style.fontWeight = 'bold';
            grid.appendChild(div);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();

        // Espacios vacíos inicio mes
        for(let i=0; i<firstDay; i++) {
            let empty = document.createElement('div');
            empty.className = 'cal-day disabled';
            grid.appendChild(empty);
        }

        for(let d=1; d<=lastDay; d++) {
            let dayBox = document.createElement('div');
            dayBox.className = 'cal-day';
            dayBox.innerText = d;
            
            const checkDate = new Date(year, month, d);
            if(checkDate.getDay() === 0) {
                dayBox.classList.add('disabled');
                dayBox.title = "Domingo";
            } else {
                if(savedHolidays.includes(d)) dayBox.classList.add('selected');
                dayBox.onclick = () => {
                    dayBox.classList.toggle('selected');
                };
            }
            grid.appendChild(dayBox);
        }
        modal.style.display = 'flex';
    }

    function closeHolidayModal() {
        const hKey = getHolidayKeyInter();
        const selected = [];
        document.querySelectorAll('.cal-day.selected').forEach(el => {
            selected.push(parseInt(el.innerText));
        });
        
        localStorage.setItem(hKey, JSON.stringify(selected));
        db.ref('logistica_festivos/' + hKey).set(selected);
        
        document.getElementById('holidayModal').style.display = 'none';
        generateTablesInter();
    }

    function clearAllFieldsInter() {
        if(confirm("¿Borrar datos del mes?")) {
            const key = getStorageKeyInter();
            const hKey = getHolidayKeyInter();
            localStorage.removeItem(key);
            localStorage.removeItem(hKey);
            db.ref('logistica/' + key).remove();
            db.ref('logistica_festivos/' + hKey).remove();
            generateTablesInter();
        }
    }
    window.onload = initInter;
</script>
</body>
</html>
