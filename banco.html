<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Bancario - Irusaga</title>
    <!-- Estilos de Flatpickr para el calendario -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        :root {
            --primary: #1a73e8;
            --green-excel: #008001;
            --yellow-excel: #FFFF00;
            --cyan-excel: #00FFFF;
            --gray-row: #D9D9D9;
            --red-text: #FF0000;
            --dark-blue: #00008B;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .corr-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border: 2px solid black;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* CONTENEDOR ESTÁTICO (SUPERIOR FIJO) */
        .sticky-top-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: white;
        }

        .monthly-summary {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background-color: #f0f0f0;
            border-bottom: 2px solid black;
        }
        
        .monthly-cell {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .monthly-header { background-color: var(--dark-blue); color: white; min-height: 30px; }
        .monthly-value { 
            background-color: white; 
            color: var(--red-text); 
            min-height: 35px; 
            height: auto;
            word-break: break-all;
        }

        .header-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
        }

        .cell {
            border: 1px solid black;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 13px;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .bg-green { background-color: var(--green-excel); color: white; }
        .bg-yellow { background-color: var(--yellow-excel); color: black; }
        .bg-cyan { background-color: var(--cyan-excel); color: black; }
        .bg-black { background-color: black; color: white; justify-content: center; }
        .text-red { color: var(--red-text) !important; }

        input {
            border: none;
            background: transparent;
            width: 100%;
            font-weight: bold;
            font-size: 13px;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Mantiene las columnas alineadas */
        }

        thead th {
            background-color: var(--green-excel);
            color: white;
            border: 1px solid black;
            padding: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            border: 1px solid black;
            background-color: var(--gray-row);
            padding: 0;
            height: 35px;
        }

        /* Estilo original del selector */
        select {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-weight: bold;
            padding: 0 5px;
            cursor: pointer;
            font-size: 13px;
            appearance: none; /* Quita la flecha nativa en algunos navegadores si se desea */
        }

        .input-valor {
            padding-left: 10px;
            color: var(--red-text);
            width: 90%;
            height: 100%;
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 13px;
            outline: none;
        }

        .td-saldo {
            text-align: right;
            padding-right: 10px;
            color: var(--red-text);
            font-weight: bold;
            font-size: 14px;
        }

        .btn-borrar-corr {
            background: black;
            color: white;
            border: none;
            width: 100%;
            cursor: pointer;
            height: 100%;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 10px;
        }

        .has-data-dot {
            position: relative;
        }
        .has-data-dot::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background-color: var(--green-excel);
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="corr-container">
    
    <!-- CONTENEDOR TODO FIJO -->
    <div class="sticky-top-container">
        <!-- SECCIÓN: RESUMEN MENSUAL -->
        <div class="monthly-summary">
            <div class="monthly-cell monthly-header">ENTRADA (Mes)</div>
            <div class="monthly-cell monthly-header">SALIDA (Mes)</div>
            <div class="monthly-cell monthly-header">TRX DEPOSITO</div>
            <div class="monthly-cell monthly-header">TRX RETIRO</div>
            <div class="monthly-cell monthly-header">TOTAL COMISIÓN</div>
            
            <div class="monthly-cell monthly-value" id="m-entrada">$ 0</div>
            <div class="monthly-cell monthly-value" id="m-salida">$ 0</div>
            <div class="monthly-cell monthly-value" id="m-trx-dep">0</div>
            <div class="monthly-cell monthly-value" id="m-trx-ret">0</div>
            <div class="monthly-cell monthly-value" id="m-total-comision">$ 0</div>
        </div>

        <!-- SECCIÓN: GRILLA DE ENTRADA -->
        <div class="header-grid">
            <div class="cell bg-green">Saldo Inicio</div>
            <div class="cell bg-yellow text-red">$ <input type="text" id="saldo-inicio" value="0" oninput="formatAndCalc(this)"></div>
            <div class="cell"><button class="btn-borrar-corr" onclick="resetCorresponsal()">Borrar Día</button></div>
            <div class="cell bg-black">Transacciones</div>
            <div class="cell bg-yellow" style="justify-content: center;" id="total-trans">0</div>

            <div class="cell bg-green">Saldo</div>
            <div class="cell bg-yellow text-red">$ <span id="resumen-saldo">0</span></div>
            <div class="cell bg-cyan">Compensaciones</div>
            <div class="cell bg-yellow">Deposito</div>
            <div class="cell bg-yellow text-red">$ <span id="resumen-deposito">0</span></div>

            <div class="cell bg-green text-red" style="font-size: 11px;">Cupo Disponible</div>
            <div class="cell bg-yellow text-red">$ <input type="text" id="cupo" value="0" readonly></div>
            <div class="cell bg-yellow text-red">$ <input type="text" id="comp-1" value="0" oninput="formatAndCalc(this)"></div>
            <div class="cell bg-yellow">Retiro</div>
            <div class="cell bg-yellow text-red">$ <span id="resumen-retiro">0</span></div>

            <div class="cell bg-green">Saldo Efectivo</div>
            <div class="cell bg-yellow text-red">$ <span id="resumen-efectivo">0</span></div>
            <div class="cell bg-yellow text-red">$ <input type="text" id="comp-2" value="0" oninput="formatAndCalc(this)"></div>
            <div class="cell bg-yellow">Fecha</div>
            <div class="cell bg-yellow"><input type="text" id="corr-fecha" placeholder="Seleccione fecha" readonly></div>
        </div>

        <!-- CABECERA DE TABLA -->
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">Explicación (Tipo)</th>
                    <th style="width: 25%;">Valor</th>
                    <th style="width: 40%;">Saldo en Línea</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- CUERPO DE TABLA (SCROLLABLE) -->
    <table>
        <tbody id="filas-corresponsal"></tbody>
    </table>
</div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAbGwL0wsMBsHfaNUoPlceWWtp0tKgt2m8",
        authDomain: "ahorrobancofacturacion.firebaseapp.com",
        databaseURL: "https://ahorrobancofacturacion-default-rtdb.firebaseio.com",
        projectId: "ahorrobancofacturacion",
        storageBucket: "ahorrobancofacturacion.firebasestorage.app",
        messagingSenderId: "1056148162736",
        appId: "1:1056148162736:web:939aa574f76d22fea11375"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tablaCorr = document.getElementById('filas-corresponsal');
    const inputFecha = document.getElementById('corr-fecha');
    const CUPO_BASE = 5000000;
    
    let fp; 
    let fechasConDatos = []; 

    window.onload = function() {
        cargarFechasConDatos();
    };

    function cargarFechasConDatos() {
        db.ref('banco').on('value', (snapshot) => {
            const data = snapshot.val();
            fechasConDatos = data ? Object.keys(data) : [];
            initCalendar();
        });
    }

    function initCalendar() {
        const today = new Date().toISOString().split('T')[0];
        if (fp) { fp.redraw(); return; }
        fp = flatpickr("#corr-fecha", {
            locale: "es",
            defaultValue: today,
            defaultDate: today,
            dateFormat: "Y-m-d",
            onDayCreate: function(dObj, dStr, fp, dayElem) {
                const date = dayElem.dateObj;
                const dateStr = date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, '0') + "-" + String(date.getDate()).padStart(2, '0');
                if (fechasConDatos.includes(dateStr)) dayElem.classList.add("has-data-dot");
            },
            onChange: function() { initCorresponsal(); }
        });
        initCorresponsal();
    }

    function parseMoney(str) {
        if (!str || str === "-" || str === "") return 0;
        let cleanStr = str.toString().replace(/\./g, '').replace(/,/g, '');
        return parseFloat(cleanStr) || 0;
    }

    // Nueva función auxiliar para calcular el saldo final de un objeto de datos
    function calcularSaldoFinalDeData(data) {
        if (!data) return 0;
        let saldo = parseMoney(data.saldoInicio);
        const comp1 = parseMoney(data.comp1);
        const comp2 = parseMoney(data.comp2);
        if (data.filas) {
            data.filas.forEach(f => {
                const val = parseMoney(f.valor);
                if (f.tipo === "Retiro") saldo -= val;
                else if (f.tipo === "Deposito") saldo += val;
            });
        }
        return saldo - (comp1 + comp2);
    }

    function initCorresponsal() {
        tablaCorr.innerHTML = '';
        const fechaSeleccionada = inputFecha.value;
        if(!fechaSeleccionada) return;

        db.ref('banco/' + fechaSeleccionada).once('value', (snapshot) => {
            const savedData = snapshot.val();
            
            if (savedData) {
                // Si ya existen datos para este día, los cargamos normalmente
                document.getElementById('saldo-inicio').value = savedData.saldoInicio || "0";
                document.getElementById('comp-1').value = savedData.comp1 || "0";
                document.getElementById('comp-2').value = savedData.comp2 || "0";
                if (savedData.filas) savedData.filas.forEach(f => crearFilaCorr(f.tipo, f.valor));
                crearFilaCorr(); 
                calcularCorr();
                calcularResumenMensual();
            } else {
                // Si NO existen datos, buscamos el saldo final del día anterior registrado
                // Ordenamos las fechas existentes de forma descendente que sean menores a la actual
                const fechasAnteriores = fechasConDatos
                    .filter(f => f < fechaSeleccionada)
                    .sort((a, b) => b.localeCompare(a));

                if (fechasAnteriores.length > 0) {
                    const ultimaFecha = fechasAnteriores[0];
                    db.ref('banco/' + ultimaFecha).once('value', (snapPrev) => {
                        const dataPrev = snapPrev.val();
                        const saldoFinalPrev = calcularSaldoFinalDeData(dataPrev);
                        
                        document.getElementById('saldo-inicio').value = saldoFinalPrev.toLocaleString('es-CO');
                        document.getElementById('comp-1').value = "0";
                        document.getElementById('comp-2').value = "0";
                        crearFilaCorr(); 
                        calcularCorr();
                        calcularResumenMensual();
                    });
                } else {
                    // No hay días anteriores registrados
                    document.getElementById('saldo-inicio').value = "0";
                    document.getElementById('comp-1').value = "0";
                    document.getElementById('comp-2').value = "0";
                    crearFilaCorr(); 
                    calcularCorr();
                    calcularResumenMensual();
                }
            }
        });
    }

    function crearFilaCorr(tipo = "", valor = "") {
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="width: 35%;">
                <select class="select-exp" onchange="handleRowChange(this)">
                    <option value="" ${tipo === "" ? "selected" : ""}>-- Seleccione --</option>
                    <option value="Retiro" ${tipo === "Retiro" ? "selected" : ""}>Retiro</option>
                    <option value="Deposito" ${tipo === "Deposito" ? "selected" : ""}>Deposito</option>
                </select>
            </td>
            <td style="width: 25%;">
                <input type="text" class="input-valor" oninput="handleRowChange(this)" placeholder="0" value="${valor}">
            </td>
            <td style="width: 40%;" class="td-saldo">$ <span>0</span></td>
        `;
        tablaCorr.appendChild(tr);
    }

    function handleRowChange(element) {
        if (element.classList.contains('input-valor')) {
            let val = element.value.replace(/\D/g, "");
            element.value = val === "" ? "" : Number(val).toLocaleString('es-CO');
        }
        const filaActual = element.closest('tr');
        if (!filaActual.nextElementSibling) {
            const tipo = filaActual.querySelector('.select-exp').value;
            const valor = filaActual.querySelector('.input-valor').value;
            if (tipo !== "" || valor !== "") crearFilaCorr();
        }
        calcularCorr();
    }

    function formatAndCalc(input) {
        let isNegative = input.value.startsWith('-');
        let cleanValue = input.value.replace(/\D/g, ""); 
        input.value = (isNegative ? "-" : "") + (cleanValue === "" ? "0" : Number(cleanValue).toLocaleString('es-CO'));
        calcularCorr();
    }

    function calcularCorr() {
        const saldoInicioBase = parseMoney(document.getElementById('saldo-inicio').value);
        const comp1 = parseMoney(document.getElementById('comp-1').value);
        const comp2 = parseMoney(document.getElementById('comp-2').value);
        const totalCompensacion = comp1 + comp2;

        let currentSaldoAcumulado = saldoInicioBase;
        let sumaRetiros = 0, sumaDepositos = 0, contadorTrans = 0;

        const filas = Array.from(tablaCorr.querySelectorAll('tr'));
        filas.forEach((fila, index) => {
            const tipo = fila.querySelector('.select-exp').value;
            const valorNum = parseMoney(fila.querySelector('.input-valor').value);
            const displaySaldoFila = fila.querySelector('.td-saldo span');

            if (tipo && valorNum > 0) {
                contadorTrans++;
                if (tipo === "Retiro") { currentSaldoAcumulado -= valorNum; sumaRetiros += valorNum; } 
                else if (tipo === "Deposito") { currentSaldoAcumulado += valorNum; sumaDepositos += valorNum; }
            }
            let saldoFila = (index === filas.length - 1) ? currentSaldoAcumulado - totalCompensacion : currentSaldoAcumulado;
            displaySaldoFila.innerText = saldoFila.toLocaleString('es-CO');
        });

        document.getElementById('resumen-saldo').innerText = saldoInicioBase.toLocaleString('es-CO');
        document.getElementById('resumen-efectivo').innerText = (currentSaldoAcumulado - totalCompensacion).toLocaleString('es-CO');
        document.getElementById('resumen-retiro').innerText = sumaRetiros.toLocaleString('es-CO');
        document.getElementById('resumen-deposito').innerText = sumaDepositos.toLocaleString('es-CO');
        document.getElementById('total-trans').innerText = contadorTrans;
        document.getElementById('cupo').value = (CUPO_BASE - (currentSaldoAcumulado - totalCompensacion)).toLocaleString('es-CO');
        saveData();
    }

    function calcularResumenMensual() {
        const fechaActual = inputFecha.value; 
        if(!fechaActual) return;
        const mesActual = fechaActual.substring(0, 7);

        db.ref('banco').once('value', (snapshot) => {
            const todosLosDias = snapshot.val();
            let entradaMes = 0, salidaMes = 0, trxDepMes = 0, trxRetMes = 0, comisionTotalMes = 0;

            if (todosLosDias) {
                for (let fechaKey in todosLosDias) {
                    if (fechaKey.startsWith(mesActual)) {
                        const diaData = todosLosDias[fechaKey];
                        if (diaData.filas) {
                            diaData.filas.forEach(f => {
                                const valor = parseMoney(f.valor);
                                if (f.tipo === "Deposito") {
                                    trxDepMes++; entradaMes += valor;
                                    if (valor <= 80000) comisionTotalMes += 160;
                                    else if (valor <= 800000) comisionTotalMes += (valor * 0.0020);
                                    else comisionTotalMes += 1600;
                                } else if (f.tipo === "Retiro") {
                                    trxRetMes++; salidaMes += valor;
                                    if (valor <= 80000) comisionTotalMes += 80;
                                    else if (valor <= 800000) comisionTotalMes += (valor * 0.0010);
                                    else comisionTotalMes += 800;
                                }
                            });
                        }
                    }
                }
            }
            document.getElementById('m-entrada').innerText = "$ " + entradaMes.toLocaleString('es-CO');
            document.getElementById('m-salida').innerText = "$ " + salidaMes.toLocaleString('es-CO');
            document.getElementById('m-trx-dep').innerText = trxDepMes;
            document.getElementById('m-trx-ret').innerText = trxRetMes;
            document.getElementById('m-total-comision').innerText = "$ " + Math.round(comisionTotalMes).toLocaleString('es-CO');
        });
    }

    function saveData() {
        const fecha = inputFecha.value; if (!fecha) return;
        const filas = [];
        tablaCorr.querySelectorAll('tr').forEach(fila => {
            const tipo = fila.querySelector('.select-exp').value;
            const valor = fila.querySelector('.input-valor').value;
            if (tipo !== "" || valor !== "") filas.push({ tipo, valor });
        });
        const data = {
            saldoInicio: document.getElementById('saldo-inicio').value,
            comp1: document.getElementById('comp-1').value,
            comp2: document.getElementById('comp-2').value,
            filas: filas
        };
        db.ref('banco/' + fecha).set(data).then(() => calcularResumenMensual());
    }

    function resetCorresponsal() {
        const fecha = inputFecha.value;
        if(confirm(`¿Borrar datos del día ${fecha}?`)) {
            db.ref('banco/' + fecha).remove().then(() => initCorresponsal());
        }
    }
</script>
</body>
</html>
