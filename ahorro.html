<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorro - Irusaga</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --card-bg: #161b22;
            --border: #2d333b;
            --accent-purple: #8257e5;
            --accent-blue: #1a73e8;
            --accent-green: #34a853;
            --accent-red: #d93025;
            --text-gray: #8b949e;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 1200px; margin-top: 20px; padding-bottom: 120px; }

        /* CONTENEDOR FLOTANTE INFERIOR DERECHA */
        .bottom-right-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
        }

        /* CUADRO DE TOTAL GLOBAL */
        .global-total-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-green);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 120px;
        }

        .global-total-label {
            font-size: 0.7rem;
            color: var(--text-gray);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .global-total-amount {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        /* BOTÓN + */
        .fab-add {
            width: 65px;
            height: 65px;
            background-color: var(--accent-purple);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .fab-add:hover {
            transform: scale(1.1);
            background-color: #9366f5;
        }
        .fab-add:active { transform: scale(0.9); }

        .challenges-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px; width: 100%;
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 15px; padding: 20px; position: relative;
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 15px;
        }

        .title-section { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .challenge-name { 
            color: white; font-weight: bold; font-size: 1.1rem; 
            text-transform: uppercase; margin: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .challenge-sub { color: var(--text-gray); font-size: 0.8rem; }

        .totals-section { text-align: right; display: flex; gap: 15px; align-items: center; }
        .total-box { display: flex; flex-direction: column; }
        .total-label { font-size: 0.65rem; color: var(--text-gray); font-weight: bold; text-transform: uppercase; }
        .total-val { font-size: 1.3rem; font-weight: bold; }
        .val-ahorro { color: var(--accent-green); }
        .val-restante { color: var(--accent-purple); }

        .btn-delete-x {
            background: none; border: none; color: var(--accent-red);
            font-size: 1.8rem; font-weight: bold; cursor: pointer;
            padding: 0 0 0 10px; line-height: 1; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .btn-delete-x:hover { transform: scale(1.2); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem;
            color: white;
        }
        .btn-edit { background: var(--accent-blue); }
        .btn-clear { background: var(--accent-red); }
        .btn-save { background: var(--accent-green); }

        .collapse-trigger {
            width: 100%; background: rgba(255,255,255,0.05);
            border: none; color: var(--text-gray); padding: 8px;
            border-radius: 6px; cursor: pointer; font-size: 0.7rem;
            text-transform: uppercase; margin-bottom: 10px;
        }

        .collapse-content {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out;
            background: rgba(0,0,0,0.2); border-radius: 8px;
        }
        .collapse-content.open { max-height: 2500px; padding: 10px; border: 1px solid var(--border); }

        .savings-table { width: 100%; border-collapse: collapse; }
        .savings-table td {
            border: 1px solid var(--border); padding: 12px 5px;
            text-align: center; cursor: pointer; font-weight: bold; color: var(--text-gray);
            font-size: 0.9rem; width: 33.33%;
        }
        .cell-selected {
            background-color: rgba(52, 168, 83, 0.2) !important;
            color: var(--accent-green) !important;
            border: 1px solid var(--accent-green) !important;
        }

        .input-edit {
            background: #000; border: 1px solid var(--accent-blue);
            color: white; width: 85%; text-align: center; padding: 5px; border-radius: 4px;
        }

        .input-title {
            background: transparent; border: 1px dashed var(--accent-purple);
            color: white; font-weight: bold; width: 90%; padding: 5px;
        }

        @media (max-width: 500px) {
            .challenges-grid { grid-template-columns: 1fr; }
            .totals-section { gap: 10px; }
            .fab-add { width: 55px; height: 55px; font-size: 28px; }
            .bottom-right-controls { bottom: 20px; right: 20px; gap: 10px; }
            .global-total-amount { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="bottom-right-controls">
        <div class="global-total-card">
            <span class="global-total-label">Total Ahorro</span>
            <span class="global-total-amount" id="global-sum-val">$0</span>
        </div>
        <button class="fab-add" onclick="addNewChallenge()" title="Añadir Nuevo Reto">+</button>
    </div>

    <div class="container">
        <div class="challenges-grid" id="main-grid"></div>
    </div>

<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAbGwL0wsMBsHfaNUoPlceWWtp0tKgt2m8",
        authDomain: "ahorrobancofacturacion.firebaseapp.com",
        databaseURL: "https://ahorrobancofacturacion-default-rtdb.firebaseio.com",
        projectId: "ahorrobancofacturacion",
        storageBucket: "ahorrobancofacturacion.firebasestorage.app",
        messagingSenderId: "1056148162736",
        appId: "1:1056148162736:web:939aa574f76d22fea11375"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let challengeIds = [];
    let editingState = {};

    db.ref('ahorros_v4').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        let rawIds = data.challengeIds || [];
        challengeIds = Array.isArray(rawIds) ? rawIds : Object.values(rawIds);
        renderAll();
    });

    function formatNumber(num) {
        return new Intl.NumberFormat('de-DE').format(num);
    }

    function parseNumber(str) {
        return parseInt(str.toString().replace(/\./g, '')) || 0;
    }

    function renderAll() {
        const grid = document.getElementById('main-grid');
        const currentOpenStates = {};
        
        challengeIds.forEach(id => {
            const el = document.getElementById(`collapse-${id}`);
            if(el) currentOpenStates[id] = el.classList.contains('open');
        });

        grid.innerHTML = '';
        challengeIds.forEach(id => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="title-section" id="title-cont-${id}">
                        <h2 class="challenge-name" id="name-${id}">Cargando...</h2>
                        <span class="challenge-sub">Reto Personalizado</span>
                    </div>
                    <div class="totals-section">
                        <div class="total-box">
                            <span class="total-label">Ahorro</span>
                            <span class="total-val val-ahorro" id="val-ahorro-${id}">$0</span>
                        </div>
                        <div class="total-box">
                            <span class="total-label">Restante</span>
                            <span class="total-val val-restante" id="val-restante-${id}">$0</span>
                        </div>
                        <button class="btn-delete-x" onclick="deleteChallenge(${id})" title="Eliminar Reto">×</button>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-edit" id="btn-edit-${id}" onclick="toggleEdit(${id})">Editar</button>
                    <button class="btn btn-save" id="btn-save-${id}" onclick="saveValues(${id})" style="display:none;">Guardar</button>
                    <button class="btn btn-clear" onclick="resetProgress(${id})">Limpiar</button>
                </div>

                <button class="collapse-trigger" onclick="toggleCollapse(${id})">▼ Ver Balance / Cuadros ▼</button>
                
                <div id="collapse-${id}" class="collapse-content ${currentOpenStates[id] || editingState[id] ? 'open' : ''}">
                    <div id="edit-ctrls-${id}" style="display:${editingState[id] ? 'flex' : 'none'}; margin-bottom:10px; justify-content:center; gap:10px;">
                        <button class="btn btn-edit" onclick="adjustCells(${id}, 1)">+ Cuadro</button>
                        <button class="btn btn-edit" onclick="adjustCells(${id}, -1)">- Cuadro</button>
                    </div>
                    <table class="savings-table" id="table-${id}"></table>
                </div>
            `;
            grid.appendChild(card);
            loadData(id);
        });
    }

    async function loadData(id) {
        const snapshot = await db.ref(`ahorros_v4/data_${id}`).once('value');
        const data = snapshot.val() || { name: `Reto ${id}`, values: [0, 0, 0], saved: [] };
        
        if(!editingState[id]) {
            localStorage.setItem(`name_${id}`, data.name);
            localStorage.setItem(`vals_${id}`, JSON.stringify(data.values));
        }
        localStorage.setItem(`save_${id}`, JSON.stringify(data.saved || []));
        
        refreshUI(id);
    }

    function refreshUI(id) {
        const name = localStorage.getItem(`name_${id}`);
        const values = JSON.parse(localStorage.getItem(`vals_${id}`)) || [0];
        const isEditing = editingState[id];

        const titleCont = document.getElementById(`title-cont-${id}`);
        if(titleCont) {
            if(isEditing) {
                titleCont.innerHTML = `<input type="text" id="in-name-${id}" class="input-title" value="${name}">`;
            } else {
                titleCont.innerHTML = `<h2 class="challenge-name">${name}</h2><span class="challenge-sub">Reto Personalizado</span>`;
            }
        }

        renderTable(id, values, isEditing);
        calculateTotals(id);
    }

    function renderTable(id, values, isEditing) {
        const table = document.getElementById(`table-${id}`);
        if(!table) return;
        const saved = JSON.parse(localStorage.getItem(`save_${id}`)) || [];
        table.innerHTML = '';
        let row;
        values.forEach((v, i) => {
            if(i % 3 === 0) row = table.insertRow();
            const cell = row.insertCell();
            if(isEditing) {
                cell.innerHTML = `<input type="text" class="input-edit" value="${formatNumber(v)}" oninput="handleIn(this, ${id})">`;
            } else {
                if(saved.includes(i)) cell.className = 'cell-selected';
                cell.innerText = `$${formatNumber(v)}`;
                cell.onclick = () => toggleCheck(id, i);
            }
        });
    }

    function handleIn(el, id) {
        let v = el.value.replace(/\D/g, '');
        el.value = v === '' ? '' : formatNumber(v);
        calculateTotals(id); 
    }

    function calculateTotals(id) {
        const isEditing = editingState[id];
        let values = [];
        
        if(isEditing) {
            const table = document.getElementById(`table-${id}`);
            if(table) {
                const inputs = table.querySelectorAll('.input-edit');
                values = Array.from(inputs).map(i => parseNumber(i.value));
            }
        } else {
            values = JSON.parse(localStorage.getItem(`vals_${id}`)) || [];
        }

        const saved = JSON.parse(localStorage.getItem(`save_${id}`)) || [];
        const totalMeta = values.reduce((a,b) => a+b, 0);
        
        let totalAhorrado = 0;
        saved.forEach(idx => {
            if(values[idx] !== undefined) totalAhorrado += values[idx];
        });
        
        const ahorroEl = document.getElementById(`val-ahorro-${id}`);
        const restanteEl = document.getElementById(`val-restante-${id}`);
        if(ahorroEl) ahorroEl.innerText = `$${formatNumber(totalAhorrado)}`;
        if(restanteEl) restanteEl.innerText = `$${formatNumber(totalMeta - totalAhorrado)}`;

        updateGlobalTotal(); // Actualiza el total general cada vez que cambia una tabla
    }

    function updateGlobalTotal() {
        let globalSum = 0;
        challengeIds.forEach(id => {
            const values = JSON.parse(localStorage.getItem(`vals_${id}`)) || [];
            const saved = JSON.parse(localStorage.getItem(`save_${id}`)) || [];
            saved.forEach(idx => {
                if(values[idx] !== undefined) globalSum += values[idx];
            });
        });
        const globalEl = document.getElementById('global-sum-val');
        if(globalEl) globalEl.innerText = `$${formatNumber(globalSum)}`;
    }

    function toggleCollapse(id) {
        const coll = document.getElementById(`collapse-${id}`);
        if(coll) coll.classList.toggle('open');
    }

    function toggleCheck(id, idx) {
        let saved = JSON.parse(localStorage.getItem(`save_${id}`));
        if(saved.includes(idx)) saved = saved.filter(i => i !== idx);
        else saved.push(idx);
        
        localStorage.setItem(`save_${id}`, JSON.stringify(saved));
        saveToFirebase(id);
        refreshUI(id);
    }

    function toggleEdit(id) {
        editingState[id] = true;
        document.getElementById(`btn-edit-${id}`).style.display = 'none';
        document.getElementById(`btn-save-${id}`).style.display = 'block';
        document.getElementById(`edit-ctrls-${id}`).style.display = 'flex';
        document.getElementById(`collapse-${id}`).classList.add('open');
        refreshUI(id);
    }

    function adjustCells(id, act) {
        const inputs = document.getElementById(`table-${id}`).querySelectorAll('.input-edit');
        let currentVals = Array.from(inputs).map(i => parseNumber(i.value));
        
        if(act === 1) currentVals.push(0); 
        else if(currentVals.length > 0) currentVals.pop();
        
        localStorage.setItem(`vals_${id}`, JSON.stringify(currentVals));
        renderTable(id, currentVals, true);
        calculateTotals(id);
    }

    function saveValues(id) {
        const nameEl = document.getElementById(`in-name-${id}`);
        const name = nameEl ? nameEl.value : `Reto ${id}`;
        const inputs = document.getElementById(`table-${id}`).querySelectorAll('.input-edit');
        const values = Array.from(inputs).map(i => parseNumber(i.value)).sort((a,b) => a-b);
        
        localStorage.setItem(`name_${id}`, name);
        localStorage.setItem(`vals_${id}`, JSON.stringify(values));
        
        editingState[id] = false;
        saveToFirebase(id);
    }

    function saveToFirebase(id) {
        const data = {
            name: localStorage.getItem(`name_${id}`),
            values: JSON.parse(localStorage.getItem(`vals_${id}`)),
            saved: JSON.parse(localStorage.getItem(`save_${id}`))
        };
        db.ref(`ahorros_v4/data_${id}`).update(data);
        db.ref(`ahorros_v4/challengeIds`).set(challengeIds);
    }

    function addNewChallenge() {
        const newId = Date.now();
        const updatedIds = [...challengeIds, newId];
        const newData = { name: "NUEVO RETO", values: [0,0,0], saved: [] };

        db.ref(`ahorros_v4/data_${newId}`).set(newData).then(() => {
            db.ref(`ahorros_v4/challengeIds`).set(updatedIds);
        });
    }

    function resetProgress(id) {
        if(confirm("¿Limpiar progreso?")) {
            localStorage.setItem(`save_${id}`, "[]");
            saveToFirebase(id);
            refreshUI(id);
        }
    }

    function deleteChallenge(id) {
        const updatedIds = challengeIds.filter(i => i !== id);
        db.ref(`ahorros_v4/data_${id}`).remove().then(() => {
            db.ref(`ahorros_v4/challengeIds`).set(updatedIds);
        });
    }
</script>
</body>
</html>
