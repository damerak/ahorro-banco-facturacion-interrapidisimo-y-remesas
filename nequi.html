<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos Full Screen</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #38bdf8;
            --text-color: #f1f5f9;
            --danger-color: #ef4444;
            --border-color: #334155;
            --row-red: rgba(239, 68, 68, 0.3);
            --key-color: #fbbf24;
            --int-color: #a855f7;
            --banco-color: #f97316; /* Color naranja para Banco */
            --cuota-color: #22c55e;
        }

        * { box-spacing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .totals-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .total-container {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .main-total { font-size: 1.5rem; }
        
        .total-amount { color: var(--primary-color); margin-left: 8px; }
        .amount-llave { color: var(--key-color); }
        .amount-int { color: var(--int-color); }
        .amount-banco { color: var(--banco-color); }
        .amount-cuota { color: var(--cuota-color); }

        .label-small {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-right: 4px;
            text-transform: uppercase;
        }

        .btn-clear {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: opacity 0.2s;
        }

        .btn-clear:hover { opacity: 0.8; }

        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            min-height: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: var(--surface-color);
            border-radius: 10px;
            table-layout: fixed;
        }

        th {
            background-color: rgba(15, 23, 42, 0.5);
            color: var(--primary-color);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            border-bottom: 1px solid var(--border-color);
            padding: 4px;
            text-align: center;
        }

        tr:last-child td { border-bottom: none; }

        input[type="text"] {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border-color);
            color: white;
            width: 95%;
            padding: 6px;
            border-radius: 4px;
            text-align: right;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .check-red { accent-color: var(--danger-color) !important; }
        tr.row-red { background-color: var(--row-red); }

        @media (max-width: 1100px) {
            .header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .btn-clear { align-self: flex-end; }
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; overflow-y: auto; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="totals-group">
            <div class="total-container main-total">
                TOTAL: <span id="totalDisplay" class="total-amount">$ 0</span>
            </div>
            <div class="total-container">
                <span class="label-small">LLAVE:</span>
                <span id="totalLlave" class="total-amount amount-llave">$ 0</span>
            </div>
            <div class="total-container">
                <span class="label-small">INTER:</span>
                <span id="totalInt" class="total-amount amount-int">$ 0</span>
            </div>
            <div class="total-container">
                <span class="label-small">BANCO:</span>
                <span id="totalBanco" class="total-amount amount-banco">$ 0</span>
            </div>
            <div class="total-container">
                <span class="label-small">CUOTA:</span>
                <span id="totalCuota" class="total-amount amount-cuota">$ 0</span>
            </div>
        </div>
        <button class="btn-clear" onclick="clearAll()">LIMPIAR TABLA</button>
    </div>

    <div class="main-container">
        <table id="table1">
            <thead>
                <tr>
                    <th style="width: 30%;">VALOR</th>
                    <th>LLAVE</th>
                    <th>INTER</th>
                    <th>BANCO</th>
                    <th>CUOTA</th>
                    <th style="width: 40px;">🚩</th>
                </tr>
            </thead>
            <tbody id="tbody1"></tbody>
        </table>

        <table id="table2">
            <thead>
                <tr>
                    <th style="width: 30%;">VALOR</th>
                    <th>LLAVE</th>
                    <th>INTER</th>
                    <th>BANCO</th>
                    <th>CUOTA</th>
                    <th style="width: 40px;">🚩</th>
                </tr>
            </thead>
            <tbody id="tbody2"></tbody>
        </table>
    </div>

    <script>
        const ROWS_COUNT = 15;

        function init() {
            renderRows('tbody1');
            renderRows('tbody2');
            loadFromStorage();
        }

        function renderRows(containerId) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < ROWS_COUNT; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" class="input-money" oninput="handleMoneyInput(this)"></td>
                    <td><input type="checkbox" class="chk" onchange="handleCheckChange()"></td>
                    <td><input type="checkbox" class="chk" onchange="handleCheckChange()"></td>
                    <td><input type="checkbox" class="chk" onchange="handleCheckChange()"></td>
                    <td><input type="checkbox" class="chk" onchange="handleCheckChange()"></td>
                    <td><input type="checkbox" class="chk check-red" onchange="handleRedRow(this)"></td>
                `;
                container.appendChild(tr);
            }
        }

        function handleMoneyInput(input) {
            let val = input.value.replace(/\D/g, "");
            input.value = val ? new Intl.NumberFormat('es-CO').format(val) : "";
            updateTotal();
            saveAll();
        }

        function handleRedRow(checkbox) {
            const row = checkbox.closest('tr');
            checkbox.checked ? row.classList.add('row-red') : row.classList.remove('row-red');
            updateTotal();
            saveAll();
        }

        function handleCheckChange() {
            updateTotal();
            saveAll();
        }

        function updateTotal() {
            let totalGeneral = 0;
            let totalLlave = 0;
            let totalInt = 0;
            let totalBanco = 0;
            let totalCuota = 0;

            document.querySelectorAll('tbody tr').forEach(tr => {
                const moneyStr = tr.querySelector('.input-money').value;
                const valor = parseInt(moneyStr.replace(/\./g, "")) || 0;
                const checks = tr.querySelectorAll('.chk');
                
                const isLlave = checks[0].checked;
                const isInt = checks[1].checked;
                const isBanco = checks[2].checked;
                const isCuota = checks[3].checked;
                const isRed = checks[4].checked; // El quinto check es el rojo (bandera)

                if (!isRed) {
                    totalGeneral += valor;
                    if (isLlave) totalLlave += valor;
                    if (isInt) totalInt += valor;
                    if (isBanco) totalBanco += valor;
                    if (isCuota) totalCuota += valor;
                }
            });

            const formatter = new Intl.NumberFormat('es-CO');
            document.getElementById('totalDisplay').innerText = "$ " + formatter.format(totalGeneral);
            document.getElementById('totalLlave').innerText = "$ " + formatter.format(totalLlave);
            document.getElementById('totalInt').innerText = "$ " + formatter.format(totalInt);
            document.getElementById('totalBanco').innerText = "$ " + formatter.format(totalBanco);
            document.getElementById('totalCuota').innerText = "$ " + formatter.format(totalCuota);
        }

        function saveAll() {
            const allData = [];
            document.querySelectorAll('tbody tr').forEach(tr => {
                const money = tr.querySelector('.input-money').value;
                const checks = Array.from(tr.querySelectorAll('.chk')).map(c => c.checked);
                allData.push({ money, checks });
            });
            localStorage.setItem('tablaDataSave_v2', JSON.stringify(allData));
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('tablaDataSave_v2');
            if (!saved) return;
            const data = JSON.parse(saved);
            const rows = document.querySelectorAll('tbody tr');
            
            data.forEach((item, index) => {
                if (rows[index]) {
                    const tr = rows[index];
                    tr.querySelector('.input-money').value = item.money || "";
                    const checks = tr.querySelectorAll('.chk');
                    if (item.checks) {
                        item.checks.forEach((isChecked, i) => {
                            if (checks[i]) {
                                checks[i].checked = isChecked;
                                // El índice 4 es el check rojo en esta nueva versión
                                if (i === 4 && isChecked) tr.classList.add('row-red');
                            }
                        });
                    }
                }
            });
            updateTotal();
        }

        function clearAll() {
            if (confirm("¿Estás seguro de borrar todos los datos?")) {
                localStorage.removeItem('tablaDataSave_v2');
                location.reload();
            }
        }

        init();
    </script>

</body>
</html>
