<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Pro - Single Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --tullave-accent: #10b981;
            --input-bg: #334155;
            --border-color: #475569;
            --base-font-size: 22px; 
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            font-weight: bold;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            margin-top: 5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            width: 100%;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .subheader td {
            color: var(--text-dim);
            font-size: 16px;
            text-transform: uppercase;
            padding: 8px 0;
            text-align: center;
        }

        td { 
            padding: 8px 4px; 
            font-size: var(--base-font-size);
        }

        .label-val { width: 160px; }

        input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: right;
            font-size: var(--base-font-size);
            font-weight: bold;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .total-row-cell {
            text-align: right;
            min-width: 160px;
            font-family: 'Courier New', Courier, monospace;
        }

        .footer-section {
            border-top: 1px dashed var(--border-color);
            margin-top: 10px;
        }

        .grand-total-label {
            font-size: 20px;
            color: var(--text-dim);
        }

        .grand-total-val {
            font-size: 32px;
            color: white;
            text-align: right;
            border-bottom: 3px solid var(--tullave-accent);
        }

        .btn-clear {
            margin-top: 20px;
            background: #ef4444;
            border: none;
            color: white;
            padding: 12px 35px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-clear:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <table id="table-tl">
                <tr class="subheader">
                    <td style="text-align: left;">VALOR</td>
                    <td>CANTIDAD</td>
                    <td style="text-align: right;">TOTAL</td>
                </tr>
                <tr data-val="100000">
                    <td class="label-val">$ 100.000</td>
                    <td><input type="number" class="qty" id="tl_100k"></td>
                    <td class="total-row-cell">$ 0</td>
                </tr>
                <tr data-val="50000">
                    <td class="label-val">$ 50.000</td>
                    <td><input type="number" class="qty" id="tl_50k"></td>
                    <td class="total-row-cell">$ 0</td>
                </tr>
                <tr data-val="20000">
                    <td class="label-val">$ 20.000</td>
                    <td><input type="number" class="qty" id="tl_20k"></td>
                    <td class="total-row-cell">$ 0</td>
                </tr>
                <tr data-val="10000">
                    <td class="label-val">$ 10.000</td>
                    <td><input type="number" class="qty" id="tl_10k"></td>
                    <td class="total-row-cell">$ 0</td>
                </tr>
                <tr data-val="5000">
                    <td class="label-val">$ 5.000</td>
                    <td><input type="number" class="qty" id="tl_5k"></td>
                    <td class="total-row-cell">$ 0</td>
                </tr>
                <tr data-val="2000">
                    <td class="label-val">$ 2.000</td>
                    <td><input type="number" class="qty" id="tl_2k"></td>
                    <td class="total-row-cell">$ 0</td>
                </tr>
                <tr>
                    <td class="label-val">Monedas</td>
                    <td><input type="text" class="manual" id="tl_monedas"></td>
                    <td class="total-row-cell" id="tl_monedas_total">$ 0</td>
                </tr>
                <tr class="footer-section">
                    <td class="grand-total-label">EXTRA</td>
                    <td colspan="2"><input type="text" class="manual" id="tl_extra"></td>
                </tr>
                <tr>
                    <td class="grand-total-label">TOTAL</td>
                    <td colspan="2" class="grand-total-val" id="tl_grand_total">$ 0</td>
                </tr>
            </table>
        </div>
    </div>

    <button class="btn-clear" id="btn-clear">LIMPIAR TODO</button>

    <script>
        const formatCOP = (num) => '$ ' + new Intl.NumberFormat('de-DE').format(num);
        const cleanNum = (str) => parseInt(str.toString().replace(/\D/g, '')) || 0;

        function calculate() {
            let subTL = 0;
            document.querySelectorAll('#table-tl tr[data-val]').forEach(row => {
                let val = parseInt(row.getAttribute('data-val'));
                let qty = parseInt(row.querySelector('.qty').value) || 0;
                let total = val * qty;
                subTL += total;
                row.querySelector('.total-row-cell').innerText = formatCOP(total);
            });
            let monTL = cleanNum(document.getElementById('tl_monedas').value);
            let extTL = cleanNum(document.getElementById('tl_extra').value);
            document.getElementById('tl_monedas_total').innerText = formatCOP(monTL);
            document.getElementById('tl_grand_total').innerText = formatCOP(subTL + monTL + extTL);
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', (e) => {
                if (e.target.classList.contains('manual')) {
                    let val = cleanNum(e.target.value);
                    e.target.value = val === 0 ? "" : new Intl.NumberFormat('de-DE').format(val);
                }
                calculate();
            });
        });
    </script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD8UmZOWnI3_RFronTxFLYTVssTalnsiXI",
          authDomain: "gastosprestamoscuentasnequi.firebaseapp.com",
          databaseURL: "https://gastosprestamoscuentasnequi-default-rtdb.firebaseio.com",
          projectId: "gastosprestamoscuentasnequi",
          storageBucket: "gastosprestamoscuentasnequi.firebasestorage.app",
          messagingSenderId: "350167767655",
          appId: "1:350167767655:web:ea01b86a4ec3231c4352c2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const cajaRef = doc(db, "caja", "estado");

        // Escuchar cambios en tiempo real desde Firebase
        onSnapshot(cajaRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                Object.keys(data).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.value = data[id];
                        if (el.classList.contains('manual') && el.value !== "") {
                            el.value = new Intl.NumberFormat('de-DE').format(cleanNum(el.value));
                        }
                    }
                });
                calculate();
            }
        });

        // Guardar en Firebase cuando cambien los inputs
        async function saveToFirebase() {
            const inputs = document.querySelectorAll('input');
            const data = {};
            inputs.forEach(input => { data[input.id] = input.value; });
            await setDoc(cajaRef, data);
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                saveToFirebase();
            });
        });

        // Evento para limpiar datos en Firebase
        document.getElementById('btn-clear').addEventListener('click', async () => {
            if (confirm('¿BORRAR TODO?')) {
                const emptyData = {};
                document.querySelectorAll('input').forEach(i => {
                    i.value = "";
                    emptyData[i.id] = "";
                });
                calculate();
                await setDoc(cajaRef, emptyData);
            }
        });
    </script>
</body>
</html>
